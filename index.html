    <!-- 字型以 <link> + preconnect 載入：CSS @import 必須等父樣式表下載解析後才被發現，
         會形成額外請求鏈並延後字型探索。
         字重維持 400/500/700/900：Google Fonts 的 CJK 樣式表大小隨請求字重數量成長，
         實測 6 字重會使樣式表由 131 KB 增至 196 KB、DOMContentLoaded 由 763ms 增至 1228ms，
         因此不為修正合成粗體而犧牲首屏效能。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />

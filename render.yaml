services:
  - type: web
    name: judicial
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: hcnsec
      - key: JWT_SECRET
        sync: false
      - key: HCNSEC_API_KEY
        sync: false
      - key: HCNSEC_BASE_URL
        value: https://api.hcnsec.cn/v1
      - key: APP_URL
        sync: false

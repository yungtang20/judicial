# 靜態站：問句產出系統（fact-to-crime v15）
# 無 build、無後端；render 靜態託管直接服務 02_網站/

services:
  - type: web
    name: judicial-prod
    runtime: static
    plan: free
    # 靜態根目錄：02_網站/（index.html）
    # JSON 資料在 00_資料/，網頁用相對路徑 ../00_資料/... 讀取 → 需從倉庫根目錄服務
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /02_網站/index.html
    headers:
      - path: /*
        name: Content-Type-Charset
        value: utf-8
    envVars:
      - key: NODE_VERSION
        value: 22.23.2

services:
  - type: web
    name: judicial
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: AI_PROVIDER
        value: agnes
      - key: ALLOW_GUEST_MODE
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: HCNSEC_API_KEY
        sync: false
      - key: HCNSEC_BASE_URL
        value: https://api.hcnsec.cn/v1
      - key: HCNSEC_MODEL
        value: DeepSeek-V4-Pro
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-2.5-flash
      - key: APP_URL
        sync: false

services:
  - type: web
    # 服務名稱。實際部署的服務為 judicial-prod；
    # 名稱不一致會讓人誤以為線上服務不存在。
    name: judicial-prod
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: AI_PROVIDER
        value: agnes
      - key: ALLOW_GUEST_MODE
        value: "true"
      # 實測正式站 defense-triage 的 p90 為 30.5 秒。
      # 供應商預設 30 秒會截斷真實回應、強制退回本機規則，
      # 使用者等了近 30 秒卻拿到降級答案。設為 60 秒讓真實回應完成。
      - key: AGNES_TIMEOUT_MS
        value: "60000"
      - key: JWT_SECRET
        sync: false
      - key: HCNSEC_API_KEY
        sync: false
      - key: HCNSEC_BASE_URL
        value: https://api.hcnsec.cn/v1
      - key: HCNSEC_MODEL
        value: DeepSeek-V4-Pro
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: AGNES_MODEL
        value: agnes-3.0-flash
      - key: APP_URL
        sync: false
